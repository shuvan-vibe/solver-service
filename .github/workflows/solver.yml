# Standalone-repo copy of the solver workflow.
# Use this only if the repository root is Solver-Service/.
# For the monorepo layout (repo root = Socpublic), use
# ../../.github/workflows/solver-service.yml instead.

name: Solver Service

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: solver-service
  cancel-in-progress: true

jobs:
  run-solver:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PY_COLORS: "1"
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      XRAY_VERSION: "1.8.7"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        env:
          SOLVER_API_KEY: ${{ secrets.SOLVER_API_KEY }}
          XRAY_VLESS_CONFIG: ${{ secrets.XRAY_VLESS_CONFIG }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          missing=0
          [ -n "$SOLVER_API_KEY" ] || { echo "::error::Missing SOLVER_API_KEY secret"; missing=1; }
          [ -n "$XRAY_VLESS_CONFIG" ] || { echo "::error::Missing XRAY_VLESS_CONFIG secret"; missing=1; }
          if [ -z "$MONGO_URI" ]; then
            echo "::warning::MONGO_URI is not set - the tunnel URL will not be published to MongoDB"
          fi
          exit $missing

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            tzdata locales xvfb python3-tk python3-dev python3-xlib scrot \
            fonts-liberation fonts-noto fonts-noto-color-emoji
          sudo locale-gen en_US.UTF-8
          sudo update-locale LANG=en_US.UTF-8

      - name: Cache Xray binary
        id: cache-xray
        uses: actions/cache@v4
        with:
          path: vendor/xray
          key: xray-${{ env.XRAY_VERSION }}-${{ runner.os }}

      - name: Download Xray
        if: steps.cache-xray.outputs.cache-hit != 'true'
        run: |
          mkdir -p vendor/xray
          curl -L "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip" -o /tmp/xray.zip
          unzip -o /tmp/xray.zip xray -d vendor/xray
          chmod +x vendor/xray/xray
          rm -f /tmp/xray.zip

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt

      - name: Install cloudflared
        run: |
          curl -L 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64' -o cloudflared
          chmod +x cloudflared

      - name: Start solver + tunnel
        env:
          SOLVER_API_KEY: ${{ secrets.SOLVER_API_KEY }}
          XRAY_VLESS_CONFIG: ${{ secrets.XRAY_VLESS_CONFIG }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          SP_USERNAME_PROXY: ${{ secrets.SP_USERNAME_PROXY }}
          SP_PASSWORD_PROXY: ${{ secrets.SP_PASSWORD_PROXY }}
          XRAY_BINARY: ${{ github.workspace }}/vendor/xray/xray
          XRAY_DIR: ${{ github.workspace }}/vendor/xray
        run: |
          set -u

          nohup ./cloudflared tunnel --url http://127.0.0.1:8080 --no-autoupdate > cloudflared.log 2>&1 &
          disown || true

          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' cloudflared.log | head -1 || true)
            if [ -n "$URL" ]; then break; fi
            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "Could not obtain a cloudflared URL"
            cat cloudflared.log
            exit 1
          fi

          echo "Solver public URL: $URL"
          echo "SOLVER_PUBLIC_URL=$URL" >> "$GITHUB_ENV"
          export SOLVER_PUBLIC_URL="$URL"

          nohup python main.py > solver.log 2>&1 &
          SOLVER_PID=$!
          echo "SOLVER_PID=$SOLVER_PID" >> "$GITHUB_ENV"

          READY=0
          for i in $(seq 1 60); do
            if curl -fsS -H "X-API-Key: $SOLVER_API_KEY" "$URL/health" > /tmp/health.json 2>/dev/null; then
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" != "1" ]; then
            echo "Solver did not become healthy"
            tail -100 solver.log
            exit 1
          fi

          echo "Health:"
          cat /tmp/health.json
          {
            echo "### Solver health"
            echo '```json'
            cat /tmp/health.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Quick solve test (on push only)
        if: github.event_name == 'push'
        id: quick_solve
        continue-on-error: true
        env:
          SOLVER_API_KEY: ${{ secrets.SOLVER_API_KEY }}
        run: |
          set +e
          RESULT=$(curl -sS --max-time 240 -H "X-API-Key: $SOLVER_API_KEY" \
            "$SOLVER_PUBLIC_URL/getSocpublicToken")
          echo "$RESULT" | tee solve-test.json

          {
            echo "### Quick solve test"
            echo '```json'
            echo "$RESULT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if echo "$RESULT" | python -c "import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get('success') else 1)"; then
            echo "TOKEN_OK"
          else
            echo "::warning::Quick solve did not return a token"
            exit 1
          fi

      - name: Upload solve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solve-test
          path: |
            solve-test.json
            solver.log
            cloudflared.log
          if-no-files-found: ignore

      - name: Wait for solver auto-shutdown
        run: |
          echo "Solver is running (PID: $SOLVER_PID). Monitoring until auto-shutdown..."
          while kill -0 "$SOLVER_PID" 2>/dev/null; do
            sleep 5
          done
          echo "Solver has shut down cleanly. Workflow complete."
